name = "portfolio-ianchaya-chatbot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Comma-separated list of origins allowed to call this Worker.
# Includes localhost so `npm start` can talk to the deployed Worker while developing.
[vars]
ALLOWED_ORIGINS = "https://ianchaya.github.io,http://localhost:3000,http://127.0.0.1:3000"

# Rate-limiting store. Create it once with:
#   wrangler kv namespace create RATE_LIMIT
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "da28c4be5ef44b0d90f477a8de798d04"

# Secret (never put the real value here):
#   wrangler secret put GROQ_API_KEY
